services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workday
      POSTGRES_USER: workday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U workday -d workday]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports:
      - '127.0.0.1:5000:5000'
    environment: &workday_environment
      FLASK_ENV: ${FLASK_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in root .env}
      DATABASE_URL: postgresql+psycopg://workday:${POSTGRES_PASSWORD}@db:5432/workday
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:5000}
      UPLOAD_FOLDER: /app/backend/uploads
      COMPANY_NAME: ${COMPANY_NAME:-Workday}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
  scheduler:
    build: .
    command: [python, backend/daily_tasks.py]
    restart: unless-stopped
    environment: *workday_environment
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:
